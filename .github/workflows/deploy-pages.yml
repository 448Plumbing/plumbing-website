name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Required permissions for the official Pages actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Optimize, audit, and build site into dist
        shell: pwsh
        run: |
          ./optimize-and-build.ps1 -Root "$PWD" -BaseUrl "https://www.448plumbing.com"

      - name: Assert sitemap exists in dist
        shell: pwsh
        run: |
          if (!(Test-Path "dist/sitemap.xml")) {
            Write-Host "dist/sitemap.xml is missing!"
            Get-ChildItem -Force dist | Format-Table -AutoSize
            exit 1
          }
          Write-Host "Found dist/sitemap.xml"
          Get-ChildItem -Force dist/sitemap.xml

      - name: Debug dist output
        shell: pwsh
        run: |
          Write-Host "--- dist contents ---"
          Get-ChildItem -Force dist | Format-Table -AutoSize
          Write-Host "--- robots.txt ---"
          Get-Content dist/robots.txt
          Write-Host "--- first 10 sitemap locs ---"
          Get-Content dist/sitemap.xml | Select-String "<loc>" | Select-Object -First 10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed SEO files
        shell: bash
        run: |
          set -e
          echo "robots.txt status:"
          curl -I -s https://www.448plumbing.com/robots.txt | head -n 5
          echo "sitemap.xml status:"
          curl -I -s https://www.448plumbing.com/sitemap.xml | head -n 5
          echo "robots.txt body:"
          curl -s https://www.448plumbing.com/robots.txt | head -n 20

  set-domain:
    # Best-effort post-deploy configuration to set custom domain and try HTTPS enforcement.
    # This does not fail the workflow if the API is not available or not yet ready.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Set custom domain via API (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DOMAIN: www.448Plumbing.com
        run: |
          set -e
          echo "Attempting to set custom domain to $DOMAIN"
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages \
            -d "{\"cname\":\"$DOMAIN\"}" || true

      - name: Try to enforce HTTPS when ready (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Polling Pages status and attempting to enforce HTTPS if supported..."
          for i in {1..10}; do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/pages | tee /tmp/pages.json || true
            # Try PATCH to enforce HTTPS if endpoint supports it
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/pages \
              -d '{"https_enforced":true}' && break || true
            sleep 15
          done
